<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        position: fixed;
        top: 0;
        left: 0;
        background-color: yellow;
        padding: 10px;
      }
      .box2 {
        position: fixed;
        top: 250px;
        right: 0;
        background-color: lightcoral;
        padding: 10px;
      }
      .box3 {
        position: fixed;
        top: 250px;
        left: 0;
        background-color: lightcyan;
        padding: 10px;
      }
      .button1 {
        position: fixed;
        bottom: 50px;
        left: 0;
        background-color: lightgreen;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <div class="box">Fixed Position</div>
    <div class="box2">Fixed Position 2</div>
    <div class="box3">Fixed Position 3</div>
    <div class="button1"><button>Back to top</button></div>
  </body>
</html>
